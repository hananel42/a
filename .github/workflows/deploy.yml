# GitHub Actions workflow to automatically build and deploy the application to GitHub Pages.
# Triggered on push to main or master branch, or manually via workflow_dispatch.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling any in-progress run so new deploys can proceed
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Give the job more time for Pages deployment if needed
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static site output
        run: npm run build

      - name: Inspect build output
        run: |
          echo "dist contents:"
          ls -la ./dist || true
          if [ -f ./dist/index.html ]; then
            echo "OK: ./dist/index.html found"
          else
            echo "ERROR: ./dist/index.html not found"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Do not wait for the Pages deployment to complete (avoids failure when GitHub Pages is slow/stuck).
          # If you prefer to wait, set this to true and increase timeout-minutes accordingly.
          wait-for-deployment: false